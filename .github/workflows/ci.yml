name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: python -m pip install -r site/requirements.txt pytest
      - run: python -m pytest

  # Build the production image the way Cloud Run will (site/Dockerfile) and
  # prove the Antigravity CLI and the app inside it start. Catches Dockerfile
  # and dependency problems before they reach main.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t efc-site:ci site
      - name: CLI and app start inside the image
        run: |
          docker run --rm efc-site:ci agy --version
          docker run --rm efc-site:ci python -c "import app, agent_runtime, agent_tools_mcp; print('imports ok', agent_runtime.AGY_MODEL)"
          docker run -d --name efc -p 8080:8080 efc-site:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker logs efc | tail -20
      # A real turn with a dummy key must reach the Gemini API and be refused
      # there. "authentication required" means the CLI never entered API-key
      # mode, which is what silently pushed production onto the fallback.
      - name: CLI uses API-key mode inside the image
        run: |
          cat > /tmp/turn.py <<'EOF'
          import json, subprocess
          import agent_runtime, app
          agent_runtime.prepare(app._agent_instructions())
          cmd = [agent_runtime.AGY_BIN, "--agent", agent_runtime.AGENT_NAME, "--model", agent_runtime.AGY_MODEL,
                 "--effort", "low", "--disable-slash-commands", "--print-timeout", "40s",
                 "--output-format", "stream-json", "--input-format", "stream-json", "--print", ""]
          frame = {"event": "user", "type": "user", "message": {"role": "user", "content": [{"type": "text", "text": "hello"}]}}
          p = subprocess.run(cmd, cwd=str(agent_runtime._workspace()), env=agent_runtime._environment("/tmp/a.jsonl"),
                             input=json.dumps(frame) + "\n", capture_output=True, text=True, timeout=90)
          print(p.stdout[-1500:]); print(p.stderr[-1500:])
          assert "authentication required" not in p.stderr, "CLI is not in API-key mode"
          assert '"event":"init"' in p.stdout, "CLI never started a conversation"
          EOF
          docker run --rm -e GEMINI_API_KEY=AIzaDummyKeyForCiOnly00000000000000000 -v /tmp/turn.py:/app/turn.py efc-site:ci python turn.py
