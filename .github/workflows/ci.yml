name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: python -m pip install -r site/requirements.txt pytest
      - run: python -m pytest

  # Build the production image the way Cloud Run will (site/Dockerfile) and
  # prove the Antigravity CLI and the app inside it start. Catches Dockerfile
  # and dependency problems before they reach main.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t efc-site:ci site
      - name: CLI and app start inside the image
        run: |
          docker run --rm efc-site:ci agy --version
          docker run --rm efc-site:ci python -c "import app, agent_runtime, agent_tools_mcp; print('imports ok', agent_runtime.AGY_MODEL)"
          docker run -d --name efc -p 8080:8080 efc-site:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker logs efc | tail -20
